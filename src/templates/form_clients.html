<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Proveedor - Postobón</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .btn-postobon { background-color: #e30613; color: white; border: none; }
        .btn-postobon:hover { background-color: #b8030e; color: white; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-danger border-3 shadow-sm">
        <div class="container-fluid container">
            <a class="navbar-brand fw-bold text-danger" href="{{ url_for('home') }}">
                <i class="bi bi-box-seam text-white me-2"></i>Postobón <span class="badge bg-danger fs-6 ms-1">Logística</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('list_clients') }}">Lista de Proveedores</a></li>
                </ul>
            </div>
        </div>
    </nav>

    
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3 border-bottom">
                        <h5 class="card-title mb-0 fw-bold text-dark">
                            <i class="bi bi-truck text-danger me-2"></i>Register New Client
                        </h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="{{ url_for('form_clients') }}" method="POST">
                            
                            
                            <div class="mb-3">
                                <label for="name" class="form-label fw-semibold">Full Name / Razón Social</label>
                                <input type="text" class="form-control" id="name" name="name" aria-describedby="nameHelp" placeholder="Ej: Servitécnica S.A.S." required>
                                <div id="nameHelp" class="form-text">Write your full name.</div>
                            </div>

                           
                            <div class="mb-3">
                                <label for="idType" class="form-label fw-semibold">Identification Number</label>
                                <select class="form-select" id="idType" name="idType" aria-label="idTypeHelp" required>
                                    <option selected disabled value="">Select your identification type</option>
                                    <option value="CC">CC</option>
                                    <option value="TI">TI</option>
                                    <option value="CE">CE</option>
                                    <option value="PA">PAS</option>
                                    <option value="NIT">NIT</option>
                                </select>
                                <div id="idTypeHelp" class="form-text">Write your identification number.</div>
                            </div>

                            
                            <div class="mb-3">
                                <label for="idNumber" class="form-label fw-semibold">Identification Number</label>
                                <input type="text" class="form-control" id="idNumber" name="idNumber" aria-describedby="idNumberHelp" placeholder="Ej: 900123456-1" required>
                                <div id="idNumberHelp" class="form-text">Write your identification number.</div>
                            </div>

                            
                            <div class="mb-3">
                                <label for="adress" class="form-label fw-semibold">Adress</label>
                                <input type="text" class="form-control" id="adress" name="address" aria-describedby="adressHelp" placeholder="Ej: Zona Industrial Cúcuta" required>
                                <div id="adressHelp" class="form-text">Write your home adress.</div>
                            </div>

                            
                            <div class="mb-4">
                                <label for="exampleInputEmail1" class="form-label fw-semibold">Email address</label>
                                <input type="email" class="form-control" id="exampleInputEmail1" name="email" aria-describedby="emailHelp" placeholder="contacto@proveedor.com" required>
                                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                                <a href="{{ url_for('list_clients') }}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-postobon px-4">Guardar Proveedor</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
